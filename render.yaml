databases:
  - name: oops-cube-db
    plan: free
    databaseName: oops_cube
    user: oops_cube

services:
  - type: redis
    name: oops-cube-redis
    plan: free
    ipAllowList: []

  - type: web
    name: oops-cube-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run migrate && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: oops-cube-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: oops-cube-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true

  - type: web
    name: oops-cube-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: oops-cube-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
